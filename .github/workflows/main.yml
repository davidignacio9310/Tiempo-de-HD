name: Generar APK de Tiempo de HD
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias necesarias
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          npm install -g @pwabuilder/pwa-tooling

      - name: Generar paquete Android
        run: |
          # Usamos un flag para ignorar verificaciones de entorno que suelen fallar en CI
          pwabuilder package --platform android --url https://davidignacio9310.github.io/Tiempo-de-HD/ --output ./output --ignore-missing-manifest

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Tiempo-de-HD-APK
          path: ./output
